<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holy Moly Fest — Latin Tech · CDMX</title>
<meta name="description" content="Holy Moly Fest 2024. 11 de Mayo en Frontón México. Latin Tech, energía y comunidad. Creado por MrPig.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff2bd6'/%3E%3Ccircle cx='22' cy='28' r='5' fill='%23ffd83d'/%3E%3Ccircle cx='42' cy='28' r='5' fill='%23ffd83d'/%3E%3Ccircle cx='32' cy='18' r='5' fill='%23ffd83d'/%3E%3C/svg%3E">
<style>
  /* homepage-only overrides to match PDF */
  .home-stage {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: #fff;
    overflow: hidden;
    isolation: isolate;
  }
  .home-stage__bg {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1585464231875-d9ef1f5ad396?w=2000&q=80&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    filter: grayscale(1) contrast(1.1);
    z-index: 0;
  }
  .home-stage__bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(240,240,240,.2) 0%, rgba(0,0,0,.05) 60%, rgba(180,240,255,.3) 100%);
  }
  .home-stage__logo {
    position: relative; z-index: 3;
    width: min(720px, 88vw);
    margin: clamp(2rem, 4vw, 3rem) auto 0;
    display: block;
    filter: drop-shadow(3px 3px 0 rgba(0,0,0,.25));
  }
  .home-stage__mascot {
    position: absolute;
    width: min(340px, 42vw);
    right: 6%;
    top: 32%;
    z-index: 3;
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
  }
  .home-stage__tag {
    position: absolute;
    z-index: 3;
    font-family: var(--ff-display);
    padding: 8px 22px;
    border: 3px solid var(--ink);
    border-radius: 8px;
    box-shadow: 4px 4px 0 var(--ink);
    font-size: clamp(1rem, 1.6vw, 1.5rem);
    animation: bob 4s ease-in-out infinite;
    transition: transform .25s;
    text-decoration: none;
    color: var(--ink);
    white-space: nowrap;
  }
  .home-stage__tag:hover { transform: rotate(0deg) scale(1.1) !important; }
  .home-stage__tag--galeria { background: var(--cyan); top: 34%; left: 22%; }
  .home-stage__tag--tickets { background: #fff; top: 42%; left: 8%; animation-delay: .4s; }
  .home-stage__tag--tienda { background: #a9f5b8; top: 52%; left: 32%; animation-delay: .8s; }
  .home-stage__tag--contacto { background: var(--purple); color: #fff; top: 62%; left: 46%; animation-delay: 1.2s; }
  .home-stage__tag--aftermovie { background: var(--yellow); top: 72%; right: 18%; animation-delay: 1.6s; }
  .home-stage__tag--holyinfo { background: var(--orange); color:#fff; bottom: 26%; left: 42%; animation-delay: 2s; }
  .home-stage__sparkle {
    position: absolute;
    z-index: 2;
    font-family: var(--ff-display);
    font-size: clamp(1.5rem, 2.5vw, 2.5rem);
    animation: bob 5s ease-in-out infinite;
  }
  .home-stage__balloon {
    position: absolute;
    width: 80px; left: 8%; top: 36%;
    z-index: 3;
    animation: float 7s ease-in-out infinite;
  }
  .home-stage__cloud {
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    z-index: 2;
    width: 100%;
    height: 110px;
    display: block;
  }
  .home-stage__footer-text {
    position: absolute;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    color: var(--ink);
    font-family: var(--ff-mono);
    font-size: .8rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    z-index: 4;
  }
  @media (max-width: 760px) {
    .home-stage__mascot { width: 48vw; right: 4%; top: 38%; }
    .home-stage__balloon { width: 60px; top: 30%; }
    .home-stage__tag--galeria { top: 30%; left: 8%; }
    .home-stage__tag--tickets { top: 42%; left: 6%; }
    .home-stage__tag--tienda { top: 56%; left: 8%; }
    .home-stage__tag--contacto { top: 66%; left: 8%; }
    .home-stage__tag--aftermovie { bottom: 22%; right: 6%; }
    .home-stage__tag--holyinfo { bottom: 14%; left: 8%; }
  }
</style>
</head>
<body>

<!-- ============== HOMEPAGE HERO — full viewport, all nav via floating tags ============== -->
<main class="home-stage">
  <div class="home-stage__bg"></div>

  <!-- Arched HOLY MOLY logo -->
  <svg class="home-stage__logo" viewBox="-80 -140 860 420" aria-label="Holy Moly">
    <defs>
      <linearGradient id="hmGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffd83d"/>
        <stop offset="50%" stop-color="#ff7a1a"/>
        <stop offset="100%" stop-color="#7b3dff"/>
      </linearGradient>
      <path id="arc" d="M 60 220 A 300 300 0 0 1 640 220"/>
    </defs>
    <text font-family="Bagel Fat One, cursive" font-size="130" fill="url(#hmGrad)" stroke="#0c0c0c" stroke-width="5" text-anchor="middle">
      <textPath href="#arc" startOffset="50%">HOLY ✦ MOLY</textPath>
    </text>
  </svg>

  <!-- Mascot climbing/peeking -->
  <svg class="home-stage__mascot" viewBox="0 0 400 520" aria-hidden="true">
    <path d="M180 340 Q160 440 170 510" stroke="#c41b9f" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M220 340 Q240 440 230 510" stroke="#c41b9f" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M60 180 Q40 120 90 100 Q100 50 160 60 Q190 20 240 50 Q300 40 320 100 Q380 110 360 180 Q395 220 340 260 Q335 320 270 330 Q210 370 150 340 Q90 345 70 300 Q20 260 60 180 Z" fill="#ff2bd6" stroke="#0c0c0c" stroke-width="6"/>
    <path d="M50 150 L70 130 L55 140 L75 115" stroke="#0c0c0c" stroke-width="5" fill="#2be4ff" stroke-linejoin="round"/>
    <path d="M340 130 L360 110 L345 120 L365 95" stroke="#0c0c0c" stroke-width="5" fill="#2be4ff" stroke-linejoin="round"/>
    <circle cx="150" cy="180" r="28" fill="#ffd83d" stroke="#0c0c0c" stroke-width="5"/>
    <circle cx="250" cy="180" r="28" fill="#ffd83d" stroke="#0c0c0c" stroke-width="5"/>
    <circle cx="200" cy="125" r="26" fill="#ffd83d" stroke="#0c0c0c" stroke-width="5"/>
    <circle cx="155" cy="185" r="10" fill="#0c0c0c"/>
    <circle cx="255" cy="185" r="10" fill="#0c0c0c"/>
    <circle cx="203" cy="130" r="10" fill="#0c0c0c"/>
    <path d="M160 240 Q200 285 240 240 Q220 265 200 265 Q180 265 160 240 Z" fill="#0c0c0c"/>
    <rect x="180" y="248" width="10" height="14" fill="#fff"/>
    <rect x="210" y="248" width="10" height="14" fill="#fff"/>
    <path d="M200 265 Q205 290 195 310 Q205 300 200 275" fill="#2be4ff" stroke="#0c0c0c" stroke-width="3"/>
  </svg>

  <!-- Hot air balloon with Tickets -->
  <svg class="home-stage__balloon" viewBox="0 0 100 140">
    <path d="M20 50 Q15 10 50 5 Q85 10 80 50 Q75 70 50 75 Q25 70 20 50 Z" fill="#a9f5b8" stroke="#0c0c0c" stroke-width="3"/>
    <path d="M35 8 Q50 5 65 8 L65 72 Q50 78 35 72 Z" fill="#fff" stroke="#0c0c0c" stroke-width="3"/>
    <line x1="35" y1="75" x2="38" y2="100" stroke="#0c0c0c" stroke-width="2"/>
    <line x1="65" y1="75" x2="62" y2="100" stroke="#0c0c0c" stroke-width="2"/>
    <rect x="35" y="100" width="30" height="18" fill="#8b5a3c" stroke="#0c0c0c" stroke-width="3"/>
    <text x="50" y="45" font-family="Bagel Fat One" font-size="10" text-anchor="middle" fill="#0c0c0c">Tickets</text>
  </svg>

  <!-- Floating navigation tags -->
  <a href="galeria.html" class="home-stage__tag home-stage__tag--galeria" style="transform:rotate(-4deg);">Galería ✷</a>
  <a href="tienda.html" class="home-stage__tag home-stage__tag--tienda" style="transform:rotate(2deg);">Tienda ✦</a>
  <a href="contacto.html" class="home-stage__tag home-stage__tag--contacto" style="transform:rotate(-3deg);">Contacto</a>
  <a href="aftermovie.html" class="home-stage__tag home-stage__tag--aftermovie" style="transform:rotate(4deg);">After Movie</a>
  <a href="holy-info.html" class="home-stage__tag home-stage__tag--holyinfo" style="transform:rotate(-2deg);">Holy Info</a>

  <!-- Sparkles -->
  <span class="home-stage__sparkle" style="top:40%; left:48%; color:#ffd83d;">✦</span>
  <span class="home-stage__sparkle" style="top:64%; right:34%; color:#ff7a1a; animation-delay:1s;">✷</span>
  <span class="home-stage__sparkle" style="bottom:32%; left:16%; color:#7b3dff; animation-delay:2s;">✦</span>

  <!-- Cyan wave cloud at bottom -->
  <svg class="home-stage__cloud" viewBox="0 0 1200 110" preserveAspectRatio="none">
    <path d="M0 60 Q60 20 140 40 Q220 10 300 40 Q380 15 460 45 Q540 20 620 40 Q700 15 780 45 Q860 20 940 40 Q1020 10 1100 40 Q1160 20 1200 45 L1200 110 L0 110 Z" fill="#2be4ff" stroke="#0c0c0c" stroke-width="3"/>
  </svg>

  <div class="home-stage__footer-text">Holy Moly 2024® · All Rights Reserved</div>
</main>

<!-- ============== MOBILE DRAWER (fallback nav for small screens) ============== -->
<div class="drawer"><button class="drawer__close">✕</button><ul>
  <li><a href="index.html">Inicio</a></li><li><a href="tienda.html">Tienda</a></li><li><a href="galeria.html">Galería</a></li>
  <li><a href="tickets.html">Tickets</a></li><li><a href="aftermovie.html">After Movie</a></li>
  <li><a href="contacto.html">Contacto</a></li><li><a href="holy-info.html">Holy Info</a></li>
</ul></div>

<!-- Tickets balloon is a link too (overlay) -->
<a href="tickets.html" style="position:absolute; left:8%; top:36%; width:90px; height:130px; z-index:5;" aria-label="Tickets"></a>

<script src="script.js"></script>
</body>
</html>
